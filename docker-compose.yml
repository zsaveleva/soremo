name: soremo

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: soremo
      POSTGRES_PASSWORD: soremo
      POSTGRES_DB: soremo
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soremo"]
      interval: 2s
      retries: 30

  # S3-совместимое хранилище файлов. Вместо MinIO: его образы больше не
  # публикуются в открытых реестрах (см. docs/decisions.md).
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=64 -master.volumeSizeLimitMB=64 -master.volumePreallocate=false
    ports: ["8333:8333"]
    volumes: [s3data:/data, "./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"]

  # Headless Chromium печатает отчёты в PDF (страница /print/... фронтенда).
  chrome:
    image: chromedp/headless-shell:156.0.8078.48
    shm_size: 512m

  api:
    build: ./api
    # S3 и Chromium стартуют дольше базы: API перезапускается, пока они не готовы.
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://soremo:soremo@db:5432/soremo?sslmode=disable
      HTTP_ADDR: ":8080"
      APP_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: dev-only-secret-change-me
      SEED_DIR: /seed
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: soremo
      S3_ACCESS_KEY: soremo
      S3_SECRET_KEY: soremo-secret
      CHROME_URL: http://chrome:9222
      PRINT_BASE_URL: http://web
    volumes: ["./seed:/seed:ro"]
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }
      chrome: { condition: service_started }

  web:
    build: ./web
    environment:
      API_URL: http://api:8080
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  dbdata:
  s3data:
